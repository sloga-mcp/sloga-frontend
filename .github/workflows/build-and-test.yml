name: Build & Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/build-and-test.yml"
      - ".vscode/**"
      - "doc/**"
      - "lifecycle/**"
      - ".gitignore"
      - "README.md"
  pull_request:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    name: Check i18n catalog
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release-please-') }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@7b8610a904d57da241e4ddba17fa62b62b15aed4 # use-mise-action-v2.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: mise install:frozen
      - run: mise build:deps
      - run: mise lingui

      - name: Check for uncommitted i18n changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::i18n catalog is out of date"
            git diff packages/client/components/i18n/catalogs/en/messages.po
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@7b8610a904d57da241e4ddba17fa62b62b15aed4 # use-mise-action-v2.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: mise install:frozen
      - run: mise build:deps
      - run: mise build:check

  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # `mise format` checks the files a change actually touches, so it
          # needs history to diff against. A shallow checkout has no base and
          # the task fails loudly rather than passing vacuously.
          fetch-depth: 0

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@7b8610a904d57da241e4ddba17fa62b62b15aed4 # use-mise-action-v2.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: mise install:frozen
      - run: mise build:deps
      - run: mise lint
      - run: mise format
        env:
          # On a PUSH, diff against what the branch looked like before it, so
          # every commit the push introduced is checked — not just the tip.
          # Without this the push build compares main against itself, finds
          # nothing changed, and passes having checked no files at all.
          # Empty on pull_request (the task uses the merge-base with main),
          # and all-zeros on a branch's first push, which the task rejects
          # and falls back from.
          FORMAT_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}

  e2e:
    name: e2e Integration Test
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@7b8610a904d57da241e4ddba17fa62b62b15aed4 # use-mise-action-v2.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: mise install:frozen
      - run: mise build:deps
      - run: mise test:e2e:install-deps
      - run: mise test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/client/playwright-report/
          retention-days: 30

  # Compiles the Kotlin and the Java of packages/client/android for every
  # flavor; no JS gate covers them. Deliberately no `paths:` filter: a
  # required check whose job never runs stays "pending" forever.
  android-compile:
    name: Android Compile
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@7b8610a904d57da241e4ddba17fa62b62b15aed4 # use-mise-action-v2.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: mise install:frozen
      - run: mise build:deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # packages/client/android/app/build.gradle sets jvmToolchain(21).
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # compileSdkVersion in packages/client/android/variables.gradle.
      # Idempotent: a no-op when the runner image already has the platform.
      - name: Install Android SDK platform
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"

      # The job's status IS the script's exit status (gradle's own on a
      # compile failure). The script resolves the repo root itself.
      - name: Compile Android (Kotlin + Java)
        shell: bash
        run: bash packages/client/scripts/android-compile-gate.sh


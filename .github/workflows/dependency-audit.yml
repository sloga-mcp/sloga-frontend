name: Dependency audit

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
  schedule:
    # Daily, so an advisory published against a dependency we already ship
    # turns this red even on a day nothing was pushed.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit shipped dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # No submodules and no install: `pnpm audit` reads only the lockfile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Installs the pnpm version pinned in package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: pnpm audit against the baseline
        run: node .github/scripts/dependency-audit.mjs

packages:
  - packages/client
  - packages/stoat.js
  - packages/solid-livekit-components
  - packages/solid-dnd-directive
  - packages/js-lingui-solid/packages/jest-mocks
  - packages/js-lingui-solid/packages/babel-plugin-extract-messages
  - packages/js-lingui-solid/packages/babel-plugin-lingui-macro
allowBuilds:
  "@swc/core": true
  esbuild: true
  # Pulled in by @huggingface/transformers, which is used ONLY in the browser
  # here (onnxruntime-web). These three build native binaries for server-side
  # inference and image decoding that nothing in this app ever loads, so their
  # build scripts stay off rather than costing every install a native compile.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  # Its postinstall is only the opencollective donation banner (`|| true`);
  # the OCR runtime is fully self-hosted from public/tesseract.
  tesseract.js: false
nodeLinker: isolated

# The e2ee worker carries the media-E2EE decode witness (chip gate (d)): a
# per-sender tally of frames that arrived and frames the decode path discarded,
# posted to the main thread once a second.
#
# 🔴 Declared HERE, not under a "pnpm" key in package.json — pnpm ignores that
# key from v10 on, warns once, and installs an UNPATCHED worker. The chip then
# fails closed to amber for every call, which is the safe direction but silently
# removes the gate.
#
# 🔴 Version-exact on purpose: a livekit bump makes the patch unmatched and the
# install fails, rather than quietly shipping a worker with no witness.
patchedDependencies:
  livekit-client@2.15.13: patches/livekit-client@2.15.13.patch

# Override prettier because some of the submodules have ancient prettiers required
# Having multiple prettiers makes the vscode extension unpredictable
overrides:
  "prettier": "^3.8.1"
strictPeerDependencies: false

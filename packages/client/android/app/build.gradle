apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing credentials live outside the repo (android/keystore.properties, gitignored)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.acutest.app"
    compileSdk = rootProject.ext.compileSdkVersion
    // BuildConfig.DEBUG gates the debug-only WebView debugger / mixed-content
    // (MainActivity) — AGP 8 requires opting in to BuildConfig generation.
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        // Public identity of the app: this is the Play Store URL and can never
        // change once published. Reverse-DNS of sloga.gg, the domain we own.
        // `namespace` above deliberately stays com.acutest.app — it only names
        // the Java/Kotlin package and the generated BuildConfig/R classes, so
        // decoupling the two avoids moving 16 source files for a rename that
        // users never see. Do not "tidy" them into agreement.
        applicationId "gg.sloga.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 60
        versionName "1.46.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Distribution channel. `sideload` is the sloga.gg APK and keeps the in-app
    // updater; `play` strips it, because Google Play's Device and Network Abuse
    // policy forbids an app updating itself outside Play. ApkUpdaterPlugin and
    // REQUEST_INSTALL_PACKAGES live in src/sideload/, so they are ABSENT from a
    // Play build rather than merely disabled at runtime. DISTRIBUTION_CHANNEL is
    // read back by AppFlavorPlugin so the shared web bundle can gate the rest.
    flavorDimensions = ["distribution"]
    productFlavors {
        sideload {
            dimension "distribution"
            // Every APK ever published to updates/android/ is com.acutest.app,
            // and Android treats a different applicationId as a brand-new app:
            // shipping gg.sloga.app through the in-app updater would install a
            // SECOND Sloga beside the existing one instead of upgrading it.
            // So the sideload channel keeps its original identity; gg.sloga.app
            // (defaultConfig, above) is the Play identity only.
            // google-services.json carries clients for BOTH package names.
            applicationId "com.acutest.app"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"sideload"'
        }
        play {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"play"'
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // livekit-android brings libwebrtc for every ABI (screen-leg plan
            // §8): x86/x86_64 are dead weight in the shipped APK (+~35 MB) but
            // load-bearing for WHPX-emulator testing, so the filter is
            // RELEASE-ONLY — debug builds stay universal (probe (a)).
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // JNA: FFI runtime for the uniffi-generated E2EE bindings
    // (loads libacutest_e2ee.so from jniLibs)
    implementation 'net.java.dev.jna:jna:5.15.0@aar'
    // Native screen-leg publisher (screen-leg plan §4.1). Pinned where the
    // raw-byte FrameCryptorKeyProvider surface is reachable (probe (a)).
    // Transitively pulls its own libwebrtc (livekit.org.webrtc — never
    // collides with another org.webrtc) and audioswitch FROM JITPACK (repo
    // added in the root build.gradle).
    implementation 'io.livekit:livekit-android:2.28.0'
    // livekit.LivekitModels types (Encryption.Type in E2EEOptions' signature)
    // need protobuf on the COMPILE classpath — the POM exposes it at runtime
    // scope only (probe (a) integration fact 1).
    compileOnly 'com.google.protobuf:protobuf-javalite:3.22.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

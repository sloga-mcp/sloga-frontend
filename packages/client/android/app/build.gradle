apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing credentials live outside the repo (android/keystore.properties, gitignored)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.acutest.app"
    compileSdk = rootProject.ext.compileSdkVersion
    // BuildConfig.DEBUG gates the debug-only WebView debugger / mixed-content
    // (MainActivity) — AGP 8 requires opting in to BuildConfig generation.
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        // Public identity of the app: this is the Play Store URL and can never
        // change once published. Reverse-DNS of sloga.gg, the domain we own.
        // `namespace` above deliberately stays com.acutest.app — it only names
        // the Java/Kotlin package and the generated BuildConfig/R classes, so
        // decoupling the two avoids moving 16 source files for a rename that
        // users never see. Do not "tidy" them into agreement.
        applicationId "gg.sloga.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionName tracks the PATCH NOTES version from v0.55.0 on (it used
        // to run its own 1.x sequence, which matched nothing users could see).
        // versionCode keeps counting up untouched — it is what ApkUpdateWorker
        // and Play order releases by, and it must never go backwards. vc70 was
        // published as the 0.63.0 SIDELOAD apk and went live on Play on
        // 2026-09-26, so this release is vc71. (The vc67, vc68 and vc69 bundles
        // were built but never uploaded; skipping codes is harmless on Play.)
        versionCode 71
        versionName "0.64.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Declared before productFlavors, which reference signingConfigs.release.
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    // Distribution channel. `sideload` is the sloga.gg APK and keeps the in-app
    // updater; `play` strips it, because Google Play's Device and Network Abuse
    // policy forbids an app updating itself outside Play. ApkUpdaterPlugin and
    // REQUEST_INSTALL_PACKAGES live in src/sideload/, so they are ABSENT from a
    // Play build rather than merely disabled at runtime. DISTRIBUTION_CHANNEL is
    // read back by AppFlavorPlugin so the shared web bundle can gate the rest.
    //
    // Release signing is set per flavor, not on buildTypes.release, so that
    // foss release stays unsigned. AGP resolves a variant's signing config as
    // buildType.signingConfig ?: mergedFlavor.signingConfig, so with nothing on
    // the release build type the flavor's config applies. Debug variants are
    // unchanged: AGP gives the debug build type the debug signing config, and
    // that wins over any flavor's.
    flavorDimensions = ["distribution"]
    productFlavors {
        sideload {
            dimension "distribution"
            // Every APK ever published to updates/android/ is com.acutest.app,
            // and Android treats a different applicationId as a brand-new app:
            // shipping gg.sloga.app through the in-app updater would install a
            // SECOND Sloga beside the existing one instead of upgrading it.
            // So the sideload channel keeps its original identity; gg.sloga.app
            // (defaultConfig, above) is the Play identity only.
            // google-services.json carries clients for BOTH package names.
            applicationId "com.acutest.app"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"sideload"'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        play {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"play"'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        // F-Droid build: no Google/Firebase code and no self-updater (F-Droid
        // forbids apps updating themselves). It has its own package id, so it
        // installs beside the standard APK and F-Droid can never crossgrade a
        // standard install. No signingConfig: the release APK comes out
        // unsigned (so AGP adds no dependency-info block) and apksigner signs
        // it afterwards.
        foss {
            dimension "distribution"
            applicationId "gg.sloga.app.foss"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"foss"'
        }
    }
    // The FCM code lives in src/gms/java, compiled only by the two
    // Google-backed flavors, so foss never sees a Firebase class.
    sourceSets {
        play {
            java.srcDirs += 'src/gms/java'
        }
        sideload {
            java.srcDirs += 'src/gms/java'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // No signingConfig here: it is set per flavor (productFlavors,
            // above) so foss release stays unsigned.
            // livekit-android brings libwebrtc for every ABI (screen-leg plan
            // §8): x86/x86_64 are dead weight in the shipped APK (+~35 MB) but
            // load-bearing for WHPX-emulator testing, so the filter is
            // RELEASE-ONLY — debug builds stay universal (probe (a)).
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // JNA: FFI runtime for the uniffi-generated E2EE bindings
    // (loads libacutest_e2ee.so from jniLibs)
    implementation 'net.java.dev.jna:jna:5.15.0@aar'
    // Native screen-leg publisher (screen-leg plan §4.1). Pinned where the
    // raw-byte FrameCryptorKeyProvider surface is reachable (probe (a)).
    // Transitively pulls its own libwebrtc (livekit.org.webrtc — never
    // collides with another org.webrtc) and audioswitch FROM JITPACK (repo
    // added in the root build.gradle).
    implementation 'io.livekit:livekit-android:2.28.0'
    // livekit.LivekitModels types (Encryption.Type in E2EEOptions' signature)
    // need protobuf on the COMPILE classpath — the POM exposes it at runtime
    // scope only (probe (a) integration fact 1).
    compileOnly 'com.google.protobuf:protobuf-javalite:3.22.0'
    // FCM only for the Google-backed flavors: foss must carry no Google code
    // (verifyFossClasspathGoogleFree, below, enforces it). The BOM is scoped
    // the same way so each flavor's firebase-messaging still gets its version.
    playImplementation platform('com.google.firebase:firebase-bom:33.7.0')
    playImplementation 'com.google.firebase:firebase-messaging'
    sideloadImplementation platform('com.google.firebase:firebase-bom:33.7.0')
    sideloadImplementation 'com.google.firebase:firebase-messaging'
    // foss push goes through UnifiedPush instead of FCM.
    fossImplementation 'org.unifiedpush.android:connector:3.0.10'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// The connector (3.0.10 POM and .module) requests com.google.crypto.tink:tink
// 1.17.0, the JVM artifact, which pulls in full protobuf-java. livekit already
// ships protobuf-javalite, so the two would duplicate protobuf classes.
// tink-android is the same release built for Android and declares no protobuf
// dependency. Scoped to foss configurations, so play and sideload resolution is
// untouched. Connector 3.0.10 is the release on kotlin-stdlib 2.0.21, which
// matches the Kotlin 2.0.21 this build forces (root build.gradle).
configurations.matching { it.name.startsWith('foss') }.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('com.google.crypto.tink:tink') using module('com.google.crypto.tink:tink-android:1.17.0')
    }
}

// Fail-closed gate: F-Droid rejects any Google Play services / Firebase code, so
// every foss build first checks its runtime classpaths. A classpath that fails
// to resolve, or resolves to no external modules at all, also fails, so a broken
// lookup can never pass vacuously. The configuration cache is not enabled
// (gradle.properties), so a plain doLast resolving the configurations is fine.
def verifyFossClasspathGoogleFree = tasks.register('verifyFossClasspathGoogleFree') {
    group = 'verification'
    description = 'Fails if the foss runtime classpath contains Google Play services or Firebase.'
    doLast {
        def bannedGroups = [
            'com.google.android.gms',
            'com.google.firebase',
            'com.google.android.datatransport',
            'com.google.android.play'
        ]
        ['fossDebugRuntimeClasspath', 'fossReleaseRuntimeClasspath'].each { configName ->
            def result = configurations.getByName(configName).incoming.resolutionResult
            def unresolved = result.allDependencies.findAll {
                it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
            }
            if (!unresolved.isEmpty()) {
                throw new GradleException("verifyFossClasspathGoogleFree: ${configName} has unresolved dependencies: ${unresolved*.requested.join(', ')}")
            }
            def modules = result.allComponents.findAll {
                it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
            }*.moduleVersion
            if (modules.isEmpty()) {
                throw new GradleException("verifyFossClasspathGoogleFree: ${configName} resolved no external modules; refusing to pass vacuously")
            }
            def offending = modules.findAll { m ->
                bannedGroups.any { g -> m.group == g || m.group.startsWith(g + '.') } ||
                    m.name == 'kotlinx-coroutines-play-services'
            }
            if (!offending.isEmpty()) {
                def coords = offending.collect { m -> m.group + ':' + m.name + ':' + m.version }.join(', ')
                throw new GradleException("verifyFossClasspathGoogleFree: ${configName} contains Google code: ${coords}")
            }
            logger.lifecycle("verifyFossClasspathGoogleFree: ${configName} OK (${modules.size()} external modules)")
        }
    }
}
// configureEach rather than afterEvaluate + tasks.named: AGP 8 registers the
// variant tasks lazily from its own afterEvaluate, and configureEach reaches
// them whenever they are realized, with no dependence on callback order.
tasks.configureEach { task ->
    if (task.name == 'preFossDebugBuild' || task.name == 'preFossReleaseBuild') {
        task.dependsOn verifyFossClasspathGoogleFree
    }
}

// Foss only: baseline/ART profiles are nondeterministic, and F-Droid's
// reproducible-build check needs identical bytes. Play and sideload keep them.
tasks.configureEach {
    if (it.name.contains('Foss') && it.name.contains('ArtProfile')) it.enabled = false
}

// Fail-closed gate: all three flavors package the same src/main/assets, whose
// CSP follows SLOGA_FDROID at `cap sync` time. A play or sideload build after a
// foss sync would ship the foss CSP, and a foss build after a standard sync
// would ship the Google and hCaptcha origins, so every merge<Flavor><Type>Assets
// task first checks the synced CSP. Both predicates mirror injectAndroidCsp.mjs:
// DIRECTIVES puts translate.googleapis.com in connect-src and both hCaptcha
// origins in script-src, and the foss policy drops FOSS_OMITTED_ORIGINS from
// every directive. A change to either list there must be made here too.
// This guards only the CSP of the synced bundle, not the JS (webDir) axis: a
// standard CSP over the live web dist passes it. That axis is checked by
// build-android-foss.sh (foss) and the release sweep's dist gates (standard).
// Every gradle packaging task must be flavor-scoped: an unscoped assemble,
// bundle, build or assembleDebug realizes both guards, so one of them always
// fails. A fresh tree has no synced bundle and needs a sync for the flavor
// being packaged (the release's build-android-0NN.sh for play and sideload,
// /home/mcp/build-android-foss.sh for foss) before any packaging task. There
// is deliberately no bypass property.
def webAssetsIndexHtml = file('src/main/assets/public/index.html')
// Returns [kind, description]; kind is 'standard', 'foss' or null. Reads only
// the File captured above, so it never touches the project at execution time.
def classifyWebAssetsCsp = { File html ->
    if (!html.isFile()) {
        return [null, 'missing (no synced web bundle)']
    }
    def text = html.getText('UTF-8')
    // Origins are compared case-insensitively, as the WebView matches them.
    def lower = text.toLowerCase(Locale.ROOT)
    def markers = text.count('<!-- android-csp:start -->')
    def metas = (text =~ /(?i)http-equiv\s*=\s*["']?content-security-policy/).size()
    def policies = []
    def m = text =~ /<!-- android-csp:start --><meta http-equiv="Content-Security-Policy" content="([^"]*)">/
    while (m.find()) {
        policies << m.group(1)
    }
    if (markers != 1 || metas != 1 || policies.size() != 1) {
        return [null, "${markers} android-csp markers, ${metas} CSP metas and ${policies.size()} injected CSP blocks, not exactly 1 of each"]
    }
    // Each directive as [name, source...].
    def directives = policies[0].toLowerCase(Locale.ROOT).split(';')*.trim().findAll { it }.collect { it.split(/\s+/) as List }
    def has = { String name, String source -> directives.any { it[0] == name && it.drop(1).contains(source) } }
    def omitted = ['https://translate.googleapis.com', 'https://hcaptcha.com', 'https://*.hcaptcha.com']
    if (has('connect-src', omitted[0]) && has('script-src', omitted[1]) && has('script-src', omitted[2])) {
        return ['standard', 'the standard CSP']
    }
    if (!directives.any { d -> d.drop(1).any { omitted.contains(it) } } &&
            !lower.contains('googleapis') && !lower.contains('hcaptcha')) {
        return ['foss', 'the foss CSP']
    }
    return [null, 'a CSP that is neither the standard nor the foss one']
}
def verifyStandardWebAssets = tasks.register('verifyStandardWebAssets') {
    group = 'verification'
    description = 'Fails unless the synced web bundle carries the standard (play and sideload) CSP.'
    doLast { task ->
        def (kind, found) = classifyWebAssetsCsp(webAssetsIndexHtml)
        if (kind != 'standard') {
            throw new GradleException("verifyStandardWebAssets: src/main/assets/public/index.html: ${found}; want the standard CSP " +
                "(translate.googleapis.com in connect-src, both hCaptcha origins in script-src). " +
                "Re-run the release's build-android-0NN.sh with SLOGA_FDROID unset in the environment (it syncs the standard " +
                "bundle with webDir dist_apk; with SLOGA_FDROID=1 exported, that sync injects the foss CSP instead).")
        }
        task.logger.lifecycle('verifyStandardWebAssets: OK (standard CSP in src/main/assets/public/index.html)')
    }
}
def verifyFossWebAssets = tasks.register('verifyFossWebAssets') {
    group = 'verification'
    description = 'Fails unless the synced web bundle carries the foss CSP.'
    doLast { task ->
        def (kind, found) = classifyWebAssetsCsp(webAssetsIndexHtml)
        if (kind != 'foss') {
            throw new GradleException("verifyFossWebAssets: src/main/assets/public/index.html: ${found}; want the foss CSP " +
                "(no translate.googleapis.com or hCaptcha origin, and no googleapis/hcaptcha text, in index.html). " +
                "Build foss with /home/mcp/build-android-foss.sh.")
        }
        task.logger.lifecycle('verifyFossWebAssets: OK (foss CSP in src/main/assets/public/index.html)')
    }
}
tasks.configureEach { task ->
    def m = task.name =~ /^merge(Play|Sideload|Foss)(Debug|Release)Assets$/
    if (m.matches()) {
        task.dependsOn(m.group(1) == 'Foss' ? verifyFossWebAssets : verifyStandardWebAssets)
    }
}
// configureEach silently wires nothing if AGP ever renames these tasks, so
// configuration fails unless all six exist. projectsEvaluated rather than
// afterEvaluate: it runs after every project's afterEvaluate, including the
// one in which AGP registers its variant tasks, so it does not depend on
// callback order. tasks.named finds a registered task without realizing it.
def appTasks = tasks
gradle.projectsEvaluated {
    ['Play', 'Sideload', 'Foss'].each { flavor ->
        ['Debug', 'Release'].each { type ->
            def name = "merge${flavor}${type}Assets".toString()
            try {
                appTasks.named(name)
            } catch (UnknownTaskException e) {
                throw new GradleException("web assets guard: AGP no longer creates ${name}, so the CSP check is wired to nothing. " +
                    "Update the merge task regex above.", e)
            }
        }
    }
}

apply from: 'capacitor.build.gradle'

// Per-flavor google-services.json: src/play and src/sideload each carry a copy,
// and foss has none. IGNORE lets the foss variant skip the missing JSON instead
// of failing; the googleServices extension exists only once the plugin is
// applied, so it is configured inside this branch. On F-Droid both JSON files
// are removed and the plugin's classpath line is sed'd out of the root
// build.gradle, so this branch must not run there.
try {
    def servicesJSONs = [file('src/play/google-services.json'), file('src/sideload/google-services.json')]
    if (servicesJSONs.any { it.exists() && it.text }) {
        apply plugin: 'com.google.gms.google-services'
        googleServices {
            missingGoogleServicesStrategy = com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy.IGNORE
        }
    } else {
        logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
